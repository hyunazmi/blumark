[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blumark"
version = "1.0.2"
description = "A PySide6 GUI tool for covering video watermarks with blur"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.23",
]

[project.gui-scripts]
blumark = "blumark.app:main"

[tool.setuptools.packages.find]
include = ["blumark*"]

[tool.setuptools.package-data]
blumark = [
    "resources/icons/*.svg",
    "resources/icons/LICENSE",
    "resources/logo.svg",
    "resources/logo.png",
    "resources/logo.ico",
]
